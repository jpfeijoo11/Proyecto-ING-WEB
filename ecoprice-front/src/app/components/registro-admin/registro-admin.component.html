<main style="max-width: 700px; margin: 40px auto; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333;">

  <header>
    <h2 style="border-bottom: 2px solid #007bff; padding-bottom: 10px;">Panel de Administración Aduanera</h2>
    <p style="color: #666;">Gestión de Agentes e Inspectores - CustomGate 360</p>
  </header>

  <div *ngIf="mensajeError" style="background-color: #f8d7da; color: #721c24; padding: 12px; border-radius: 5px; margin-bottom: 20px;">
    <strong>Error:</strong> {{ mensajeError }}
  </div>
  <div *ngIf="mensajeExito" style="background-color: #d4edda; color: #155724; padding: 12px; border-radius: 5px; margin-bottom: 20px;">
    {{ mensajeExito }}
  </div>

  <form (ngSubmit)="registrar()" style="background: #fdfdfd; padding: 20px; border: 1px solid #eee; border-radius: 8px;">

    <fieldset style="border: none; padding: 0;">
      <legend style="font-weight: bold; margin-bottom: 15px;">Datos del Nuevo Colaborador</legend>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <p>
          <label>Nombre Completo:</label><br>
          <input type="text" name="nombre" [(ngModel)]="usuario.nombreCompleto" style="width: 100%; padding: 8px;" required>
        </p>
        <p>
          <label>Usuario (ID):</label><br>
          <input type="text" name="user" [(ngModel)]="usuario.username" style="width: 100%; padding: 8px;" required>
        </p>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <p>
          <label>Contraseña:</label><br>
          <input type="password" name="pass" [(ngModel)]="usuario.password" style="width: 100%; padding: 8px;" required>
        </p>
        <p>
          <label>Rol asignado:</label><br>
          <select name="rol" [(ngModel)]="usuario.rol" style="width: 100%; padding: 8px;" required>
            <option value="" disabled>-- Seleccione --</option>
            <option value="AGENTE">Agente de Aduanas</option>
            <option value="INSPECTOR">Inspector de Aduana</option>
            <option value="ADMIN">Administrador</option>
          </select>
        </p>
      </div>

      <p>
        <label>Cédula (Validación Backend):</label><br>
        <input type="text" name="dni" [(ngModel)]="usuario.cedula" style="width: 100%; padding: 8px;" placeholder="Ej: 1722453139">
      </p>
    </fieldset>

    <fieldset style="border: none; padding: 0; margin-top: 20px;">
      <legend style="font-weight: bold; margin-bottom: 15px;">Ubicación de Operaciones</legend>
      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
        <select name="p" [(ngModel)]="paisSeleccionado" (change)="onPaisChange()" style="padding: 8px;">
          <option [ngValue]="null">-- País --</option>
          <option *ngFor="let p of paises" [ngValue]="p">{{ p.nombre }}</option>
        </select>

        <select name="pr" [(ngModel)]="provinciaSeleccionada" (change)="onProvinciaChange()" style="padding: 8px;">
          <option [ngValue]="null">-- Provincia --</option>
          <option *ngFor="let pr of provincias" [ngValue]="pr">{{ pr.nombre }}</option>
        </select>

        <select name="c" [(ngModel)]="ciudadSeleccionada" style="padding: 8px;">
          <option [ngValue]="null">-- Ciudad --</option>
          <option *ngFor="let c of ciudades" [ngValue]="c">{{ c.nombre }}</option>
        </select>
      </div>
    </fieldset>

    <div style="margin-top: 25px; display: flex; gap: 10px;">
      <button type="submit" style="flex: 2; background-color: #28a745; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-weight: bold;">
        Registrar
      </button>

      <button type="button" (click)="consultarUsuarios()" style="flex: 1; background-color: #6c757d; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer;">
        {{ mostrarTabla ? 'Ocultar Lista' : 'Consultar Usuarios' }}
      </button>
    </div>
  </form>

  <section *ngIf="mostrarTabla" style="margin-top: 40px; animation: fadeIn 0.5s;">
    <h3 style="color: #007bff;">Listado de Personal Activo</h3>
    <table style="width: 100%; border-collapse: collapse; background: white; border: 1px solid #dee2e6;">
      <thead>
        <tr style="background-color: #343a40; color: white; text-align: left;">
          <th style="padding: 12px; border: 1px solid #dee2e6;">Nombre</th>
          <th style="padding: 12px; border: 1px solid #dee2e6;">Rol</th>
          <th style="padding: 12px; border: 1px solid #dee2e6;">Cédula</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let u of usuariosRegistrados" style="border-bottom: 1px solid #eee;">
          <td style="padding: 10px;">{{ u.nombreCompleto }}</td>
          <td style="padding: 10px;">
            <span [style.color]="u.rol === 'ADMIN' ? '#007bff' : (u.rol === 'AGENTE' ? '#28a745' : '#fd7e14')">
              <strong>{{ u.rol }}</strong>
            </span>
          </td>
          <td style="padding: 10px;">{{ u.cedula }}</td>
        </tr>
      </tbody>
    </table>
  </section>

</main>
