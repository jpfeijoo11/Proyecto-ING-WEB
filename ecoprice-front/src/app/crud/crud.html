<div class="crud-container">
  <h1>Panel de Monitoreo</h1>
  
  <div class="form">
    <input [(ngModel)]="nuevo.nombre" placeholder="Nombre del producto">
    <input [(ngModel)]="nuevo.url" placeholder="URL Tienda">
    <input type="number" [(ngModel)]="nuevo.precioObjetivo" placeholder="Precio Meta">
    <button (click)="guardar()">Agregar</button>
  </div>

  <table>
    <tr>
      <th>Producto</th>
      <th>Precio Meta</th>
      <th>Acción</th>
    </tr>
    <tr *ngFor="let p of productos">
      <td>{{ p.nombre }}</td>
      <td>${{ p.precioObjetivo }}</td>
      <td><button class="btn-del" (click)="borrar(p.id)">Eliminar</button></td>
    </tr>
  </table>
</div>
