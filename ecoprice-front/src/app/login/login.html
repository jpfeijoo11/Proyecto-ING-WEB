<main style="max-width: 400px; margin: 80px auto; font-family: Arial, sans-serif; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
  <header style="text-align: center; margin-bottom: 20px;">
    <h2>Iniciar Sesión</h2>
    <p>CustomGate 360 - Sistema Aduanero</p>
  </header>

  <output *ngIf="mensajeError" style="display: block; background-color: #f8d7da; color: #721c24; padding: 10px; margin-bottom: 15px; border-radius: 5px;" role="alert">
    {{ mensajeError }}
  </output>

  <form (ngSubmit)="iniciarSesion()">
    <p style="margin-bottom: 15px;">
      <label for="username">Usuario:</label><br>
      <input type="text" id="username" name="username" [(ngModel)]="credenciales.username" style="width: 100%; padding: 8px;" required>
    </p>

    <p style="margin-bottom: 20px;">
      <label for="password">Contraseña:</label><br>
      <input type="password" id="password" name="password" [(ngModel)]="credenciales.password" style="width: 100%; padding: 8px;" required>
    </p>

    <button type="submit" style="width: 100%; background-color: #28a745; color: white; border: none; padding: 10px; font-size: 16px; cursor: pointer; border-radius: 5px; margin-bottom: 10px;">
      Ingresar
    </button>
  </form>
</main>
